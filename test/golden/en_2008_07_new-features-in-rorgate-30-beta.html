<p>There are three new features in RoRGate 3.0:</p>
<h2 id="pictures-as-icons">Pictures as icons</h2>
<figure>
<label for="mn-fig-7" class="margin-toggle">⊕</label><input type="checkbox" id="mn-fig-7" class="margin-toggle"/><span class="marginnote">Now you can use png and jpeg files as icons</span>
<img src="https://raw.githubusercontent.com/juanger/rorgate/master/meta/images/2008-07-15/RoRgate-0.3b.png" alt=""/>
</figure>
<h2 id="web-inspector">Web Inspector</h2>
<figure>
<label for="mn-fig-11" class="margin-toggle">⊕</label><input type="checkbox" id="mn-fig-11" class="margin-toggle"/><span class="marginnote">The WebKit inspector can be accessed through a contextual menu.</span>
<img src="https://raw.githubusercontent.com/juanger/rorgate/master/meta/images/2008-07-15/Inspector.png" alt=""/>
</figure>
<h2 id="preferences">Preferences</h2>
<figure>
<label for="mn-fig-15" class="margin-toggle">⊕</label><input type="checkbox" id="mn-fig-15" class="margin-toggle"/><span class="marginnote">Now you can change the name, port and icon of an existing app.</span>
